<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>தமிழ் AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;500;600;700;800&family=Noto+Serif+Tamil:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .result-card { background: rgba(0,0,0,0.03); border-radius: 10px; padding: 12px 14px; margin-top: 6px; }
  .result-card h4 { margin: 10px 0 4px; font-size: 0.85em; letter-spacing: 0.03em; opacity: 0.7; text-transform: uppercase; }
  .result-card h4:first-child { margin-top: 0; }
  .result-corrected { font-size: 1.05em; font-weight: 600; }
  .result-scores { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .score-pill { background: rgba(122, 28, 52, 0.12); border-radius: 999px; padding: 4px 10px; font-size: 0.85em; white-space: nowrap; }
  .score-pill strong { font-weight: 700; }
  .error-block { border-left: 3px solid rgba(122, 28, 52, 0.4); padding: 4px 0 4px 10px; margin: 6px 0; font-size: 0.9em; }
  .error-block .wrong { text-decoration: line-through; opacity: 0.7; }
  .error-block .correct { font-weight: 600; }
  .error-block .explain { display: block; opacity: 0.85; margin-top: 2px; }
  .result-explain { margin-top: 6px; font-size: 0.9em; opacity: 0.9; }
  .result-note { margin-top: 6px; font-size: 0.8em; opacity: 0.6; font-style: italic; }
  .tamil-kb-toggle { background: none; border: 1px solid rgba(0,0,0,0.15); border-radius: 8px; font-size: 0.85em; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  .tamil-kb-toggle.active { background: rgba(122, 28, 52, 0.12); border-color: rgba(122, 28, 52, 0.4); }
  .tamil-kb { display: none; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 8px; margin-bottom: 6px; background: rgba(0,0,0,0.03); border-radius: 10px; }
  .tamil-kb.open { display: grid; }
  .tamil-kb button { font-family: 'Noto Serif Tamil', serif; font-size: 1.1em; padding: 6px 0; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; background: #fff; cursor: pointer; }
  .tamil-kb button.wide { grid-column: span 2; font-family: inherit; font-size: 0.85em; }
</style>
</head>
<body>

<div class="page chat-page">

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-brand">
        <div class="brand-mark">அ</div>
        <div><strong>தமிழ் இலக்கணம்</strong></div>
      </div>
      <button class="new-chat-btn" id="newChatBtn" type="button">+ புதிய அரட்டை</button>
    </div>

    <div class="sidebar-history" id="historyList">
      <div class="history-label">வரலாறு (ஒவ்வொன்றும் ஒரு தனி சரிபார்ப்பு)</div>
    </div>

    <div class="sidebar-footer">
      <span>வணக்கம், {{ username }}</span>
      <a href="{{ url_for('logout') }}">வெளியேறு</a>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" title="History" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="chat-title">
          <strong>தமிழ் AI Chat</strong>
          <span>Ask about spelling, grammar, or sentence structure</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="chartBtn" title="Chart Analysis" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="messages" class="chat-messages">
      <div class="chat-messages-inner" id="messagesInner"></div>
    </div>

    <div class="chat-input-wrap">
      <div class="tamil-kb" id="tamilKb"></div>
      <form id="chatForm" class="chat-input-row">
        <button type="button" class="tamil-kb-toggle" id="tamilKbToggle" title="தமிழ் விசைப்பலகை">அ-ஃ</button>
        <input id="chatInput" type="text" placeholder="உங்கள் செய்தியை இங்கே தட்டச்சு செய்யவும்..." autocomplete="off" lang="ta">
        <button type="submit" class="chat-send-round" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
      <div class="chat-hint">தமிழ் AI தவறுகள் செய்யக்கூடும். முக்கியமான தகவலை சரிபார்க்கவும்.</div>
    </div>
  </main>
</div>

<script>
const form = document.getElementById('chatForm');
const input = document.getElementById('chatInput');
const messagesEl = document.getElementById('messagesInner');
const historyList = document.getElementById('historyList');
const newChatBtn = document.getElementById('newChatBtn');
const sidebar = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const chartBtn = document.getElementById('chartBtn');
const sendBtn = document.getElementById('sendBtn');
const tamilKb = document.getElementById('tamilKb');
const tamilKbToggle = document.getElementById('tamilKbToggle');

let activeSubmissionId = null;

const truncate = (text, len = 30) => !text ? '' : (text.length > len ? text.slice(0, len) + '…' : text);

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
}

function appendBubble(text, who) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + who;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = who === 'user' ? 'நீ' : 'அ';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    bubble.style.whiteSpace = 'pre-wrap';

    row.append(avatar, bubble);
    messagesEl.appendChild(row);
    messagesEl.parentElement.scrollTop = messagesEl.parentElement.scrollHeight;
    return bubble;
}

function errorBlockHtml(err) {
    return `<div class="error-block">
        <span class="wrong">${escapeHtml(err.wrong)}</span> → <span class="correct">${escapeHtml(err.correct)}</span>
        ${err.explanation ? `<span class="explain">${escapeHtml(err.explanation)}</span>` : ''}
      </div>`;
}

function scorePillHtml(label, value) {
    const shown = (value === null || value === undefined) ? '—' : `${value}/100`;
    return `<span class="score-pill">${label}: <strong>${shown}</strong></span>`;
}
function renderBotResult(data) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = 'அ';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (!data.parsed_ok) {
        bubble.style.whiteSpace = 'pre-wrap';
        bubble.textContent = data.reply || 'AI பதில் கிடைக்கவில்லை.';
        const note = document.createElement('div');
        note.className = 'result-note';
        note.textContent = 'இந்த முறை AI முழு வடிவமைப்பைப் பின்பற்றவில்லை -- மூல பதிலைக் காட்டுகிறோம்.';
        bubble.appendChild(note);
        row.append(avatar, bubble);
        messagesEl.appendChild(row);
        messagesEl.parentElement.scrollTop = messagesEl.parentElement.scrollHeight;
        return;
    }

    const scores = data.scores || {};
    const spellingErrors = data.spelling_errors || [];
    const grammarErrors = data.grammar_errors || [];

    bubble.innerHTML = `
      <div class="result-card">
        <h4>திருத்தப்பட்ட உரை</h4>
        <div class="result-corrected">${escapeHtml(data.corrected_text)}</div>

        <h4>எழுத்துப் பிழைகள்</h4>
        ${spellingErrors.length ? spellingErrors.map(errorBlockHtml).join('') : '<div class="error-block">இல்லை</div>'}

        <h4>இலக்கணப் பிழைகள்</h4>
        ${grammarErrors.length ? grammarErrors.map(errorBlockHtml).join('') : '<div class="error-block">இல்லை</div>'}

        <h4>மதிப்பெண்கள்</h4>
        <div class="result-scores">
          ${scorePillHtml('எழுத்துப்பிழை', scores.spelling_score)}
          ${scorePillHtml('இலக்கணம்', scores.grammar_score)}
          ${scorePillHtml('வாக்கிய அமைப்பு', scores.sentence_score)}
          ${scorePillHtml('மொத்தம்', scores.overall_score)}
        </div>

        ${data.overall_explanation ? `<div class="result-explain">${escapeHtml(data.overall_explanation)}</div>` : ''}
      </div>`;

    row.append(avatar, bubble);
    messagesEl.appendChild(row);
    messagesEl.parentElement.scrollTop = messagesEl.parentElement.scrollHeight;
}
function showTyping() {
    removeTyping();
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingRow';
    row.innerHTML = `<div class="msg-avatar">அ</div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(row);
    messagesEl.parentElement.scrollTop = messagesEl.parentElement.scrollHeight;
}

function removeTyping() {
    document.getElementById('typingRow')?.remove();
}

function setSendingState(isSending) {
    sendBtn.disabled = isSending;
    input.disabled = isSending;
    if (!isSending) input.focus();
}
async function loadHistory() {
    historyList.innerHTML = '<div class="history-label">வரலாறு (ஒவ்வொன்றும் ஒரு தனி சரிபார்ப்பு)</div>';

    try {
        const res = await fetch('/api/submissions');
        const rows = await res.json();
        if (!res.ok) { console.error('History error:', rows); return; }

        if (!Array.isArray(rows) || rows.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'history-item';
            empty.style.cssText = 'cursor:default;opacity:0.6;';
            empty.textContent = 'இதுவரை உரையாடல் இல்லை';
            historyList.appendChild(empty);
            return;
        }

        rows.forEach(sub => {
            const item = document.createElement('div');
            item.className = 'history-item' + (sub.submission_id === activeSubmissionId ? ' active' : '');
            item.textContent = truncate(sub.input_text);
            item.dataset.id = sub.submission_id;
            item.addEventListener('click', () => selectSubmission(sub));
            historyList.appendChild(item);
        });
    } catch (err) {
        console.error('Failed to load history:', err);
    }
}
async function selectSubmission(sub) {
    if (!sub) return;
    activeSubmissionId = sub.submission_id;
    messagesEl.innerHTML = '';
    highlightActive();
    closeSidebarMobile();

    if (sub.input_text) appendBubble(sub.input_text, 'user');

    try {
        const res = await fetch(`/api/submission/${sub.submission_id}`);
        const data = await res.json();
        if (res.ok) renderBotResult(data);
        else if (sub.clean_text) appendBubble(sub.clean_text, 'bot');
    } catch (err) {
        console.error('Failed to load submission detail:', err);
        if (sub.clean_text) appendBubble(sub.clean_text, 'bot');
    }
}

function highlightActive() {
    [...historyList.children].forEach(el => {
        if (el.classList?.contains('history-item')) {
            el.classList.toggle('active', Number(el.dataset.id) === Number(activeSubmissionId));
        }
    });
}

function startNewChat() {
    activeSubmissionId = null;
    messagesEl.innerHTML = '';
    highlightActive();
    input.value = '';
    input.focus();
}
function openSidebarMobile() { sidebar.classList.add('open'); sidebarBackdrop.classList.add('show'); }
function closeSidebarMobile() { sidebar.classList.remove('open'); sidebarBackdrop.classList.remove('show'); }
sidebarToggle.addEventListener('click', openSidebarMobile);
sidebarBackdrop.addEventListener('click', closeSidebarMobile);
newChatBtn.addEventListener('click', startNewChat);
chartBtn.addEventListener('click', () => alert('பகுப்பாய்வு அம்சம் விரைவில் வருகிறது! (Coming soon)'));
const TAMIL_KEYS = [
    'அ','ஆ','இ','ஈ','உ','ஊ','எ','ஏ','ஐ','ஒ',
    'ஓ','ஔ','ஃ','க','ங','ச','ஞ','ட','ண','த',
    'ந','ப','ம','ய','ர','ல','வ','ழ','ள','ற',
    'ன','்','ா','ி','ீ','ு','ூ','ெ','ே','ை',
];

function insertAtCursor(text) {
    const pos = input.selectionStart || input.value.length;
    input.value = input.value.slice(0, pos) + text + input.value.slice(pos);
    input.setSelectionRange(pos + text.length, pos + text.length);
    input.focus();
}

function buildTamilKeyboard() {
    TAMIL_KEYS.forEach(ch => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = ch;
        btn.addEventListener('click', () => insertAtCursor(ch));
        tamilKb.appendChild(btn);
    });

    const spaceBtn = document.createElement('button');
    spaceBtn.type = 'button';
    spaceBtn.className = 'wide';
    spaceBtn.textContent = 'இடைவெளி';
    spaceBtn.addEventListener('click', () => insertAtCursor(' '));
    tamilKb.appendChild(spaceBtn);

    const backBtn = document.createElement('button');
    backBtn.type = 'button';
    backBtn.className = 'wide';
    backBtn.textContent = '⌫ நீக்கு';
    backBtn.addEventListener('click', () => {
        const pos = input.selectionStart || input.value.length;
        if (pos > 0) {
            input.value = input.value.slice(0, pos - 1) + input.value.slice(pos);
            input.setSelectionRange(pos - 1, pos - 1);
        }
        input.focus();
    });
    tamilKb.appendChild(backBtn);
}

buildTamilKeyboard();
tamilKbToggle.addEventListener('click', () => {
    tamilKb.classList.toggle('open');
    tamilKbToggle.classList.toggle('active');
});
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    appendBubble(text, 'user');
    input.value = '';
    showTyping();
    setSendingState(true);

    try {
        const res = await fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        console.log('Flask response:', data);
        removeTyping();

        if (res.ok && (data.corrected_text || data.reply)) {
            renderBotResult(data);
        } else if (data.error) {
            console.error('Server error:', data.error);
            appendBubble('பிழை: ' + data.error, 'bot');
        } else {
            console.error('Unexpected response:', data);
            appendBubble('AI பதில் கிடைக்கவில்லை.', 'bot');
        }

        if (data.submission_id) {
            activeSubmissionId = data.submission_id;
            await loadHistory();
        }
    } catch (err) {
        removeTyping();
        console.error('Fetch error:', err);
        appendBubble('சேவையகத்துடன் இணைக்க முடியவில்லை.', 'bot');
    } finally {
        setSendingState(false);
    }
});

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
    }
});
loadHistory();
input.focus();
</script>
</body>
</html>
